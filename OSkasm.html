<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unlimited OS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #1a1a1a url('https://wallpapercave.com/wp/wp2757874.jpg') center/cover no-repeat;
      height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
      overflow: hidden;
    }

    .taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40px;
      background: rgba(30,30,40,0.95);
      display: flex;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -2px 4px #000a;
    }

    .start-menu-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 0 14px;
      height: 100%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      border-right: 1px solid #444;
      user-select: none;
    }

    .title {
      margin-left: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .start-menu {
      position: fixed;
      left: 10px;
      bottom: 50px;
      background: #222c;
      border-radius: 6px;
      box-shadow: 0 6px 16px #000a;
      min-width: 180px;
      z-index: 150;
      animation: fadeIn .15s;
    }

    .start-menu ul {
      list-style: none;
      margin: 0;
      padding: 4px 0;
    }

    .start-menu li {
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .start-menu li:hover, .start-menu a:hover {
      background: #444;
    }

    .start-menu a {
      color: inherit;
      text-decoration: none;
      display: block;
    }

    .hidden {
      display: none;
    }

    .desktop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 40px;
      overflow: hidden;
      z-index: 1;
    }

    .app-window {
      position: absolute;
      left: 10vw;
      top: 10vh;
      width: 80vw;
      height: 75vh;
      background: #292a32;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px #0008;
      display: flex;
      flex-direction: column;
      z-index: 50;
      min-width: 300px;
      min-height: 300px;
      border: 1px solid #444;
    }

    .window-header {
      background: #222;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
      user-select: none;
    }

    .window-header button {
      background: #e33;
      border: none;
      color: #fff;
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
    }

    .kasm-iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #111;
      border: none;
      min-height: 200px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="taskbar">
    <div class="start-menu-btn" onclick="toggleMenu()">☰ Menu</div>
    <span class="title">Web OS Unlimited Edition</span>
  </div>
  <div id="start-menu" class="start-menu hidden">
    <ul>
      <li onclick="openApp('kali')">App Center</li>
    </ul>
  </div>
  <div class="desktop">
    <div id="kali-window" class="app-window hidden">
      <div class="window-header">
        <span>Enjoy the Operating System!</span>
        <button onclick="closeApp('kali')">✕</button>
      </div>
      <iframe 
        src="https://neomatrix531.github.io/Maxi-OS/kaliOSembedded.html" 
        frameborder="0"
        allowfullscreen
        class="kasm-iframe"
        title="unlimited os"
        ></iframe></div>
    <!-- You can add more app windows here -->
  </div>
  <script>
    // Simple web desktop OS logic

    function toggleMenu() {
      const menu = document.getElementById('start-menu');
      menu.classList.toggle('hidden');
    }

    // Open app windows
    function openApp(app) {
      if (app === 'kali') {
        document.getElementById('kali-window').classList.remove('hidden');
        toggleMenu();
      }
    }

    // Close app windows
    function closeApp(app) {
      if (app === 'kali') {
        document.getElementById('kali-window').classList.add('hidden');
      }
    }

    // Hide start menu when clicking outside
    window.addEventListener('click', function(e) {
      const menu = document.getElementById('start-menu');
      const btn = document.querySelector('.start-menu-btn');
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
